# /etc/nginx/sites-available/zvoni
# Скопировать: sudo cp nginx.conf /etc/nginx/sites-available/zvoni
# Включить:    sudo ln -sf /etc/nginx/sites-available/zvoni /etc/nginx/sites-enabled/zvoni
# Проверить:   sudo nginx -t
# Перезапуск:  sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name po-zvoni.ru www.po-zvoni.ru;
    return 301 https://$host$request_uri;
}

# Основной HTTPS сервер
server {
    listen 443 ssl http2;
    server_name po-zvoni.ru www.po-zvoni.ru;

    ssl_certificate     /etc/letsencrypt/live/po-zvoni.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/po-zvoni.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Размер буфера для Socket.io long-polling
    client_max_body_size 10M;

    # ── Socket.io ────────────────────────────────────────────────────────────
    # ВАЖНО: location должен быть точным и стоять ДО / чтобы nginx не
    # перехватывал его как фронтенд
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Таймауты для долгих WebSocket-соединений
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 5s;

        # Отключить буферизацию — нужно для realtime
        proxy_buffering off;
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass        http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── Frontend (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass        http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header  Upgrade    $http_upgrade;
        proxy_set_header  Connection $connection_upgrade;
        proxy_set_header  Host       $host;
        proxy_set_header  X-Real-IP  $remote_addr;
        proxy_read_timeout 60s;
    }
}

